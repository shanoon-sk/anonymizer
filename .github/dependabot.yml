version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Batch routine dev-tooling bumps into one PR; runtime deps (mupdf, tesseract.js,
      # transformers, jszip, electron) stay separate so each can be reviewed and tested.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [electron]
    ignore:
      # Majors need manual migration (TS 7 = new compiler; @types/node tracks the Node 22 runtime used by Electron)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
