name: Release

# Push a tag `v<version>` matching package.json → installers are built, uploaded to the R2 bucket
# `anonymo` under v<version>/, and the download worker is redeployed to point /windows and /mac at
# them (https://anonymo.shanoon.workers.dev).
#
# Needs repository (or `release` environment) secrets:
#   CLOUDFLARE_API_TOKEN   – token with "Workers R2 Storage: Edit" and "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    tags: ['v*']
  workflow_dispatch: # run it on a tag ref (Use workflow from → Tags → v…)

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Run on tag v$version (package.json), got $REF_TYPE '$REF_NAME'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: wrangler@4.154.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: release
          merge-multiple: true

      - name: Check installers and write checksums
        working-directory: release
        run: |
          exe="Anonymo-Setup-$VERSION.exe"
          dmg="Anonymo-$VERSION-arm64.dmg"
          for f in "$exe" "$dmg"; do
            [ -f "$f" ] || { echo "::error::missing $f"; ls -la; exit 1; }
            # wrangler r2 object put is limited to 300 MiB
            [ "$(stat -c %s "$f")" -lt 314572800 ] || { echo "::error::$f is over 300 MiB"; exit 1; }
          done
          sha256sum "$exe" "$dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Versioned paths are served as immutable, so never overwrite a release that is already live.
      - name: Refuse to overwrite an existing release
        run: |
          if npx -y "$WRANGLER" r2 object get "anonymo/v$VERSION/SHA256SUMS.txt" --remote --pipe > /dev/null 2>&1; then
            echo "::error::v$VERSION is already in R2 — bump the version"
            exit 1
          fi

      - name: Upload to R2
        working-directory: release
        run: |
          # Checksums last: the download page shows them, so they mark the release complete.
          for f in "Anonymo-Setup-$VERSION.exe" "Anonymo-$VERSION-arm64.dmg" SHA256SUMS.txt; do
            npx -y "$WRANGLER" r2 object put "anonymo/v$VERSION/$f" --file "$f" --remote \
              --content-disposition "attachment; filename=\"$f\""
          done

      - name: Deploy download worker
        working-directory: download-worker
        run: npx -y "$WRANGLER" deploy --var "VERSION:$VERSION"

      - name: Smoke test
        run: |
          base=https://anonymo.shanoon.workers.dev
          for p in windows mac; do
            loc=$(curl -sI "$base/$p" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            echo "/$p → $loc"
            case "$loc" in *"/v$VERSION/"*) ;; *) echo "::error::/$p does not point at v$VERSION"; exit 1;; esac
            curl -sfI "$loc" > /dev/null || { echo "::error::$loc is not served"; exit 1; }
          done
