name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: build:win
          - os: macos-latest
            target: build:mac
          - os: ubuntu-latest
            target: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache offline assets (NER model, OCR data)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/models
            resources/tessdata
          key: assets-${{ hashFiles('scripts/fetch-assets.mjs') }}
      - run: npm run fetch-assets
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.target }}
        env:
          # Windows signing (recommended): configure Azure Trusted Signing or CSC_LINK/CSC_KEY_PASSWORD secrets
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  # Microsoft Store package (MSIX/AppX). Needs the Partner Center identity values in electron-builder.yml.
  store:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/models
            resources/tessdata
          key: assets-${{ hashFiles('scripts/fetch-assets.mjs') }}
      - run: npm run fetch-assets
      - run: npm test
      - run: npm run build:store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microsoft-store-package
          path: dist/*.appx
